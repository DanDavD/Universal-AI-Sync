<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancelled — Universal AI Sync</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #71717a; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    a {
      display: inline-block;
      background: #1d4ed8;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 24px;
      text-decoration: none;
    }
    a:hover { background: #1e40af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">↩</div>
    <h1>Payment cancelled</h1>
    <p class="subtitle">No charge was made. You can try again whenever you're ready.</p>
    <a href="/checkout.html">Try again</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Universal AI Sync</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #09090b;
      --surface: #18181b;
      --raised:  #27272a;
      --border:  #3f3f46;
      --text:    #f4f4f5;
      --text-2:  #a1a1aa;
      --text-3:  #71717a;
      --green:   #22c55e;
      --blue:    #3b82f6;
      --yellow:  #eab308;
      --red:     #ef4444;
      --purple:  #a78bfa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Login Screen ─────────────────────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 340px;
      text-align: center;
    }
    .login-card h1 { font-size: 18px; margin-bottom: 6px; }
    .login-card p  { color: var(--text-3); font-size: 13px; margin-bottom: 24px; }
    .login-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      outline: none;
      font-family: monospace;
    }
    .login-card input:focus { border-color: var(--blue); }
    .login-card button {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
    }
    .login-card button:hover { background: #2563eb; }
    .login-error { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }

    /* ── Main App ─────────────────────────────────────────────────────────── */
    #app { display: none; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 15px; font-weight: 700; color: var(--text); }
    .header-badge {
      font-size: 10px;
      background: var(--purple);
      color: #fff;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-logout:hover { border-color: var(--text-2); color: var(--text); }

    main { padding: 28px; max-width: 1200px; margin: 0 auto; }

    /* ── Stats Cards ──────────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .stat-label { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-sub   { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .stat-card.green { border-color: #16a34a44; }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.blue  { border-color: #1d4ed844; }
    .stat-card.blue  .stat-value { color: var(--blue); }
    .stat-card.purple { border-color: #7c3aed44; }
    .stat-card.purple .stat-value { color: var(--purple); }

    /* ── Controls ─────────────────────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
    }
    .search-input:focus { border-color: var(--blue); }
    .search-input::placeholder { color: var(--text-3); }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--blue); }

    .btn {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 14px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); color: var(--text); }

    /* ── Table ────────────────────────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--raised); }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      border-top: 1px solid var(--border-subtle, #27272a);
      font-size: 12px;
      color: var(--text-2);
      vertical-align: middle;
    }
    tr:hover td { background: var(--raised); }

    .email-cell { color: var(--text); font-weight: 500; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-premium  { background: #7c3aed22; color: var(--purple); border: 1px solid #7c3aed44; }
    .badge-free     { background: #3f3f4644; color: var(--text-3); border: 1px solid var(--border); }
    .badge-active   { background: #16a34a22; color: var(--green);  border: 1px solid #16a34a44; }
    .badge-pending  { background: #ca8a0422; color: var(--yellow); border: 1px solid #ca8a0444; }
    .badge-cancelled{ background: #ef444422; color: var(--red);    border: 1px solid #ef444444; }
    .badge-suspended{ background: #ef444422; color: var(--red);    border: 1px solid #ef444444; }

    .key-cell {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-3);
      cursor: pointer;
    }
    .key-cell:hover { color: var(--text-2); }

    .actions-cell { display: flex; gap: 6px; align-items: center; }
    .action-btn {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .action-btn:hover { background: var(--raised); color: var(--text); }
    .action-btn.promote { border-color: #7c3aed44; color: var(--purple); }
    .action-btn.promote:hover { background: #7c3aed22; }
    .action-btn.demote  { border-color: var(--border); }
    .action-btn.delete  { border-color: #ef444444; color: var(--red); }
    .action-btn.delete:hover { background: #ef444422; }

    /* ── Pagination ───────────────────────────────────────────────────────── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .page-info { font-size: 12px; color: var(--text-3); }
    .page-btns { display: flex; gap: 6px; }
    .page-btn {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-2);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
    }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-btn:not(:disabled):hover { background: var(--border); }

    /* ── Empty / Loading ──────────────────────────────────────────────────── */
    .empty-row td {
      text-align: center;
      color: var(--text-3);
      padding: 32px;
    }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--raised);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ── Login ──────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <h1>Admin Panel</h1>
    <p>Universal AI Sync — User Management</p>
    <input type="password" id="admin-key-input" placeholder="Admin secret key" />
    <button onclick="login()">Enter</button>
    <p class="login-error" id="login-error">Invalid key — try again</p>
  </div>
</div>

<!-- ── App ────────────────────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="header-left">
      <span class="header-logo">Universal AI Sync</span>
      <span class="header-badge">Admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">Log out</button>
  </header>

  <main>
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="stat-total">—</div></div>
      <div class="stat-card purple"><div class="stat-label">Premium</div><div class="stat-value" id="stat-premium">—</div><div class="stat-sub" id="stat-mrr">—</div></div>
      <div class="stat-card blue"><div class="stat-label">Free</div><div class="stat-value" id="stat-free">—</div></div>
      <div class="stat-card green"><div class="stat-label">Active</div><div class="stat-value" id="stat-active">—</div></div>
      <div class="stat-card"><div class="stat-label">Cancelled</div><div class="stat-value" id="stat-cancelled">—</div></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input class="search-input" id="search" type="text" placeholder="Search by email…" />
      <select id="plan-filter">
        <option value="">All plans</option>
        <option value="premium">Premium</option>
        <option value="free">Free</option>
      </select>
      <button class="btn" onclick="loadUsers()">↺ Refresh</button>
      <button class="btn" onclick="exportCSV()">↓ Export CSV</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Plan</th>
            <th>Status</th>
            <th>License Key</th>
            <th>PayPal Sub ID</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr class="empty-row"><td colspan="7">Loading…</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <span class="page-info" id="page-info">—</span>
        <div class="page-btns">
          <button class="page-btn" id="btn-prev" onclick="changePage(-1)">← Prev</button>
          <button class="page-btn" id="btn-next" onclick="changePage(1)">Next →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
  const PER_PAGE = 50
  let adminKey  = ''
  let page      = 1
  let totalRows = 0
  let debounceTimer = null

  // ── Auth ──────────────────────────────────────────────────────────────────
  function login() {
    const key = document.getElementById('admin-key-input').value.trim()
    if (!key) return
    adminKey = key
    localStorage.setItem('adminKey', key)
    initApp()
  }

  function logout() {
    localStorage.removeItem('adminKey')
    adminKey = ''
    document.getElementById('app').style.display = 'none'
    document.getElementById('login-screen').style.display = 'flex'
    document.getElementById('admin-key-input').value = ''
  }

  async function initApp() {
    // Verify key by hitting /api/admin/stats
    try {
      const res = await api('/api/admin/stats')
      if (!res.ok) { showLoginError(); return }
      document.getElementById('login-screen').style.display = 'none'
      document.getElementById('app').style.display = 'block'
      renderStats(await res.json())
      loadUsers()
    } catch {
      showLoginError()
    }
  }

  function showLoginError() {
    const el = document.getElementById('login-error')
    el.style.display = 'block'
    setTimeout(() => { el.style.display = 'none' }, 3000)
  }

  // ── API ───────────────────────────────────────────────────────────────────
  function api(path, opts = {}) {
    return fetch(path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Key':  adminKey,
        ...(opts.headers ?? {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    })
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function renderStats(s) {
    document.getElementById('stat-total').textContent    = fmt(s.total)
    document.getElementById('stat-premium').textContent  = fmt(s.premium)
    document.getElementById('stat-free').textContent     = fmt(s.free_users)
    document.getElementById('stat-active').textContent   = fmt(s.active)
    document.getElementById('stat-cancelled').textContent = fmt(s.cancelled ?? 0)
    document.getElementById('stat-mrr').textContent      =
      `$${((s.premium ?? 0) * 9.99).toFixed(2)} est. MRR`
  }

  // ── Users ─────────────────────────────────────────────────────────────────
  async function loadUsers() {
    const search = document.getElementById('search').value.trim()
    const plan   = document.getElementById('plan-filter').value
    const params = new URLSearchParams({ search, plan, page, perPage: PER_PAGE })

    try {
      const [usersRes, statsRes] = await Promise.all([
        api(`/api/admin/users?${params}`),
        api('/api/admin/stats'),
      ])
      const { users, total } = await usersRes.json()
      totalRows = total
      renderTable(users)
      renderPagination()
      if (statsRes.ok) renderStats(await statsRes.json())
    } catch (err) {
      showToast('Error loading users: ' + err.message)
    }
  }

  function renderTable(users) {
    const tbody = document.getElementById('users-tbody')
    if (!users.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No users found</td></tr>'
      return
    }
    tbody.innerHTML = users.map((u) => `
      <tr data-id="${u.id}">
        <td class="email-cell">${esc(u.email)}</td>
        <td><span class="badge badge-${u.plan}">${u.plan}</span></td>
        <td><span class="badge badge-${u.status}">${u.status}</span></td>
        <td class="key-cell" onclick="copyText('${esc(u.license_key ?? '')}', this)"
            title="Click to copy">
          ${u.license_key ? u.license_key : '<span style="color:#52525b">—</span>'}
        </td>
        <td style="font-size:11px;color:var(--text-3)">
          ${u.paypal_subscription_id
            ? `<span title="${u.paypal_subscription_id}">${u.paypal_subscription_id.slice(0,12)}…</span>`
            : '<span style="color:#52525b">—</span>'}
        </td>
        <td>${fmtDate(u.created_at)}</td>
        <td>
          <div class="actions-cell">
            ${u.plan === 'free'
              ? `<button class="action-btn promote" onclick="setPlan('${u.id}', 'premium', 'active')">↑ Premium</button>`
              : `<button class="action-btn demote"  onclick="setPlan('${u.id}', 'free', 'active')">↓ Free</button>`
            }
            <button class="action-btn delete" onclick="removeUser('${u.id}', '${esc(u.email)}')">✕</button>
          </div>
        </td>
      </tr>
    `).join('')
  }

  function renderPagination() {
    const start = (page - 1) * PER_PAGE + 1
    const end   = Math.min(page * PER_PAGE, totalRows)
    document.getElementById('page-info').textContent =
      totalRows ? `${start}–${end} of ${totalRows}` : '0 users'
    document.getElementById('btn-prev').disabled = page <= 1
    document.getElementById('btn-next').disabled = end >= totalRows
  }

  function changePage(delta) {
    page = Math.max(1, page + delta)
    loadUsers()
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  async function setPlan(id, plan, status) {
    try {
      const res  = await api(`/api/admin/users/${id}/plan`, { method: 'PATCH', body: { plan, status } })
      const data = await res.json()
      if (!data.ok) { showToast('Error: ' + data.error); return }
      showToast(`User set to ${plan}`)
      loadUsers()
    } catch (err) { showToast('Error: ' + err.message) }
  }

  async function removeUser(id, email) {
    if (!confirm(`Delete user "${email}"? This cannot be undone.`)) return
    try {
      await api(`/api/admin/users/${id}`, { method: 'DELETE' })
      showToast('User deleted')
      loadUsers()
    } catch (err) { showToast('Error: ' + err.message) }
  }

  // ── Export CSV ────────────────────────────────────────────────────────────
  async function exportCSV() {
    try {
      const res    = await api(`/api/admin/users?perPage=10000`)
      const { users } = await res.json()
      const header = ['email', 'plan', 'status', 'license_key', 'paypal_subscription_id', 'created_at']
      const rows   = users.map((u) =>
        header.map((k) => `"${(u[k] ?? '').toString().replace(/"/g, '""')}"`).join(',')
      )
      const csv  = [header.join(','), ...rows].join('\n')
      const blob = new Blob([csv], { type: 'text/csv' })
      const a    = document.createElement('a')
      a.href     = URL.createObjectURL(blob)
      a.download = `users-${new Date().toISOString().slice(0,10)}.csv`
      a.click()
    } catch (err) { showToast('Export failed: ' + err.message) }
  }

  // ── Utilities ─────────────────────────────────────────────────────────────
  const esc    = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  const fmt    = (n) => Number(n ?? 0).toLocaleString()
  const fmtDate = (s) => s ? new Date(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'

  function copyText(text, el) {
    if (!text) return
    navigator.clipboard.writeText(text).then(() => {
      const orig = el.style.color
      el.style.color = 'var(--green)'
      setTimeout(() => { el.style.color = orig }, 1200)
    })
  }

  let toastTimer = null
  function showToast(msg) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800)
  }

  // ── Search debounce ───────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(debounceTimer)
      debounceTimer = setTimeout(() => { page = 1; loadUsers() }, 350)
    })
    document.getElementById('plan-filter').addEventListener('change', () => {
      page = 1; loadUsers()
    })
    document.getElementById('admin-key-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login()
    })

    // Auto-login if key saved
    const saved = localStorage.getItem('adminKey')
    if (saved) { adminKey = saved; initApp() }
  })
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal AI Sync</title>
  <style>
    /* ── Design Tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg:            #09090b;
      --surface:       #18181b;
      --elevated:      #27272a;
      --border:        #3f3f46;
      --border-subtle: #27272a;
      --text:          #f4f4f5;
      --text-2:        #a1a1aa;
      --text-3:        #71717a;
      --blue:          #3b82f6;
      --blue-dim:      rgba(59,130,246,0.18);
      --green:         #22c55e;
      --purple:        #7c3aed;
      --red:           #ef4444;
      --ease:          all 0.2s ease;
    }

    /* ── Reset ─────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -.01em;
    }
    .header-badge {
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      letter-spacing: .03em;
    }

    /* ── Section Label ─────────────────────────────────────────────────────── */
    .section-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 5px;
    }

    /* ── Divider ───────────────────────────────────────────────────────────── */
    .divider { height: 1px; background: var(--border-subtle); }

    /* ── AI Tabs List ──────────────────────────────────────────────────────── */
    #tab-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 148px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    #tab-list::-webkit-scrollbar { width: 3px; }
    #tab-list::-webkit-scrollbar-track { background: transparent; }
    #tab-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--ease);
      flex-shrink: 0;
    }
    .tab-item:hover:not(.tab-item--used) {
      background: var(--surface);
      border-color: var(--border-subtle);
    }
    .tab-item--used {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
    }

    .tab-logo {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: contain;
      flex-shrink: 0;
      background: var(--elevated);
    }
    .tab-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .tab-platform {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .tab-page-title {
      font-size: 10px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Letter-avatar fallback shown when a favicon image fails to load */
    .logo-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
    }
    .logo-fallback--tab  { width: 22px; height: 22px; font-size: 11px; border-radius: 5px; }
    .logo-fallback--slot { width: 30px; height: 30px; font-size: 14px; }

    .tab-used-tag {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-3);
      background: var(--elevated);
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .empty-msg {
      color: var(--text-3);
      font-size: 11px;
      text-align: center;
      padding: 12px 0;
      line-height: 1.6;
    }

    /* ── Sync Flow ─────────────────────────────────────────────────────────── */
    .flow-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .slot-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* Base slot */
    .slot {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--ease);
      flex-shrink: 0;
    }

    /* Empty slot */
    .slot--empty {
      border: 2px dashed var(--border);
      background: var(--elevated);
      cursor: default;
    }
    .slot-placeholder {
      font-size: 20px;
      color: var(--border);
      line-height: 1;
    }

    /* Focused (waiting for selection) — empty */
    .slot--empty.slot--focused {
      border-color: var(--blue);
      background: var(--blue-dim);
      animation: pulse-ring 1.8s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0   rgba(59,130,246,0.45); }
      50%       { box-shadow: 0 0 0 6px rgba(59,130,246,0);    }
    }

    /* Filled slot */
    .slot--filled {
      border: 2px solid var(--border);
      background: var(--elevated);
      cursor: pointer;
    }
    .slot--filled:hover { filter: brightness(1.15); }

    /* Filled + focused (ready to be replaced) */
    .slot--filled.slot--focused {
      animation: pulse-ring 1.8s ease-in-out infinite;
    }

    .slot-logo {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      object-fit: contain;
    }

    /* Clear button (×) */
    .slot-clear {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 17px;
      height: 17px;
      background: var(--red);
      border: 2px solid var(--bg);
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--ease);
      padding: 0;
      z-index: 2;
    }
    .slot-clear:hover { background: #dc2626; transform: scale(1.15); }

    .slot-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    /* Arrow */
    .flow-arrow {
      display: flex;
      align-items: center;
      color: var(--text-3);
      flex-shrink: 0;
      padding-bottom: 18px; /* offset to visually align with slot centers */
    }
    .flow-arrow svg { display: block; }

    /* ── Progress Bar ──────────────────────────────────────────────────────── */
    #progress-bar { display: none; }
    .progress-track {
      height: 3px;
      background: var(--elevated);
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--purple);
      border-radius: 2px;
      transition: width 350ms ease, background 200ms;
    }
    #progress-label {
      font-size: 10px;
      color: var(--text-2);
      margin-top: 4px;
    }

    /* ── Action Buttons ────────────────────────────────────────────────────── */
    .actions { display: flex; }
    .action-btn {
      all: unset;
      cursor: pointer;
      flex: 1;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      border: 1px solid var(--border);
      color: var(--text-2);
      background: var(--surface);
      transition: var(--ease);
    }
    .action-btn:hover:not(:disabled) { background: var(--elevated); }
    .action-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    #btn-sync { border-color: var(--purple); color: #a78bfa; }
    #btn-sync:disabled { border-color: var(--border); color: var(--text-2); }

    /* ── Footer ────────────────────────────────────────────────────────────── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #status {
      font-size: 10px;
      color: var(--text-3);
      min-height: 12px;
    }
    .footer-actions { display: flex; align-items: center; gap: 4px; }

    .footer-btn {
      all: unset;
      cursor: pointer;
      font-size: 10px;
      color: var(--text-3);
      padding: 3px 7px;
      border-radius: 5px;
      transition: var(--ease);
    }
    .footer-btn:hover { color: var(--text-2); background: var(--surface); }

    .options-link {
      font-size: 10px;
      color: var(--text-3);
      text-decoration: none;
      padding: 3px 7px;
      border-radius: 5px;
      transition: var(--ease);
    }
    .options-link:hover { color: var(--text-2); background: var(--surface); }
  </style>
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────────────────── -->
  <header>
    <span class="header-title">Universal AI Sync</span>
    <span class="header-badge">MV3</span>
  </header>

  <!-- ── AI Tabs List ─────────────────────────────────────────────────────── -->
  <section>
    <div class="section-label">Open AI Tabs</div>
    <div id="tab-list"><p class="empty-msg">Loading…</p></div>
  </section>

  <div class="divider"></div>

  <!-- ── Sync Flow ────────────────────────────────────────────────────────── -->
  <section>
    <div class="section-label">Sync Flow</div>
    <div class="flow-container">

      <div class="slot-wrapper">
        <div class="slot slot--empty slot--focused" id="slot-source">
          <span class="slot-placeholder">?</span>
        </div>
        <span class="slot-label">Source</span>
      </div>

      <div class="flow-arrow">
        <svg width="28" height="14" viewBox="0 0 28 14" fill="none">
          <path d="M1 7h22M17 1l6 6-6 6" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="slot-wrapper">
        <div class="slot slot--empty" id="slot-dest">
          <span class="slot-placeholder">?</span>
        </div>
        <span class="slot-label">Destination</span>
      </div>

    </div>
  </section>

  <!-- ── Progress Bar ─────────────────────────────────────────────────────── -->
  <div id="progress-bar">
    <div class="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-label"></div>
  </div>

  <!-- ── Action Buttons ───────────────────────────────────────────────────── -->
  <div class="actions">
    <button class="action-btn" id="btn-sync" disabled>⚡ Sync Context</button>
  </div>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer>
    <div id="status"></div>
    <div class="footer-actions">
      <button class="footer-btn" id="btn-refresh">↺ Refresh</button>
      <a class="options-link" href="../options/options.html" target="_blank">⚙ Options</a>
    </div>
  </footer>

  <script src="./popup.js"></script>
</body>
</html>
